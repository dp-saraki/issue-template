name: 障害起票
description: テストで検知した障害を起票します
title: "[障害] "
labels: ["障害", "status:起票"]
body:
  - type: markdown
    attributes:
      value: |
        ## 障害起票フォーム
        起票後、**右サイドバー**で以下を設定してください（フォームでは入力しません）。

        | サイドバー | 設定内容 |
        | --- | --- |
        | Labels | `test:` テスト分類 / `report:` 起票チーム / `team:` 担当チーム(複数可) / `ideal:` 理想検出工程 / `plan:` 企画確認 |
        | Milestone | テスト工程・サイクル（例: 結合テスト 1周目） |
        | Assignees | ネクストアクションの担当者 |
        | Projects | 管理ボード（Status / 優先度 / 完了日などを Projects フィールドで管理する場合） |

        **修正者・PM/PLが後から付けるラベル**: `priority:` 優先度 / `status:` ステータス / `class:` 障害分類 / `cause:` 原因区分 / `cause-phase:` 原因工程 / `reflect:` 他成果物への反映 / `retest:` 再テスト結果

  - type: markdown
    attributes:
      value: "## 【検知時】検知者が記載"
  - type: input
    id: feature_name
    attributes:
      label: 機能名
    validations:
      required: true
  - type: input
    id: occurred_date
    attributes:
      label: 発生日
      placeholder: "2025-01-01"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 障害内容
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現方法
      description: 障害が再現可能な手順を記載してください
      placeholder: |
        1. カルテホームにUSER0001でログインする
        2. XXボタンを押下する
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待値
    validations:
      required: true
  - type: input
    id: test_device
    attributes:
      label: テスト機種
      description: テスト実施端末（端末依存の可能性がある場合のみ）
  - type: textarea
    id: note
    attributes:
      label: 補足

  - type: markdown
    attributes:
      value: "## 【修正時】修正者が記載（起票時は空欄でOK。後から本文を編集）"
  - type: textarea
    id: investigation
    attributes:
      label: 調査結果
  - type: textarea
    id: fix_location
    attributes:
      label: 修正箇所
  - type: textarea
    id: fix_content
    attributes:
      label: 修正内容
  - type: input
    id: fixer
    attributes:
      label: 修正者
  - type: input
    id: fixed_date
    attributes:
      label: 修正日
      placeholder: "2025-01-01"
  - type: textarea
    id: horizontal_investigation
    attributes:
      label: 横展開調査結果
      description: 調査要否、調査内容、調査結果を記載
  - type: input
    id: occurred_case
    attributes:
      label: 発生ケース
      description: ケース番号を記載
  - type: textarea
    id: reflect_result
    attributes:
      label: 反映結果
  - type: textarea
    id: doc_fix
    attributes:
      label: ドキュメント修正
      description: 修正要否、対象のドキュメント名を記載

  - type: markdown
    attributes:
      value: "## 【修正時】原因分析（修正者／不良埋め込み者）\n修正者が書けない場合は、不良を埋め込んだ人に依頼してください。"
  - type: textarea
    id: direct_cause
    attributes:
      label: 直接原因
  - type: textarea
    id: root_cause
    attributes:
      label: 根本原因
  - type: textarea
    id: countermeasure
    attributes:
      label: 根本原因への対策